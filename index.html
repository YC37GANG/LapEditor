<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เครื่องมือแก้ไข Lap Editor — YC37 Gang</title>
<style>
    :root {
        --bg: #05060F;
        --surface: #0E1020;
        --surface-2: #141728;
        --border: #242A47;
        --green: #2DD4EE;
        --amber: #FBBF74;
        --cyan: #B794F6;
        --red: #FF6B8B;
        --text: #E8ECF7;
        --text-dim: #8790AC;
    }
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', 'Sarabun', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px 16px 60px;
        background-image: radial-gradient(circle at 50% 0%, rgba(183,148,246,0.10), transparent 60%);
    }
    .container { max-width: 440px; margin: 0 auto; }
    h1 { font-size: 18px; color: var(--green); text-align: center; margin: 0 0 4px; }
    .subtitle { font-size: 12px; color: var(--text-dim); text-align: center; margin: 0 0 20px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }

    label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; letter-spacing: 0.3px; }

    select, input[type="datetime-local"] {
        width: 100%;
        background: var(--surface-2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 12px 10px;
        border-radius: 10px;
        font-size: 15px;
        font-family: inherit;
        margin-bottom: 16px;
    }
    select:focus, input:focus { outline: none; border-color: var(--cyan); }
    select:disabled, input:disabled { opacity: 0.4; }

    .field-group { margin-bottom: 4px; }
    .field-group:last-of-type { margin-bottom: 0; }

    .btn {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
    }
    .btn-save { background: var(--green); color: #06140c; }
    .btn-save:disabled { opacity: 0.35; cursor: default; }
    .btn-danger { background: transparent; border: 1px solid var(--red); color: var(--red); margin-top: 10px; }

    .status-msg { text-align: center; font-size: 13px; padding: 10px; border-radius: 10px; margin-top: 12px; display: none; }
    .status-msg.show { display: block; }
    .status-msg.ok { background: rgba(45,212,238,0.10); color: var(--green); border: 1px solid var(--green); }
    .status-msg.err { background: rgba(255,107,139,0.10); color: var(--red); border: 1px solid var(--red); }

    .raw-preview { font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-top: -8px; margin-bottom: 16px; word-break: break-all; }
    .empty-hint { text-align: center; color: var(--text-dim); font-size: 13px; padding: 30px 10px; }

    .yc-combo { position: relative; margin-bottom: 16px; }
    .yc-combo input { margin-bottom: 0; }
    .yc-dropdown { position: absolute; top: 105%; left: 0; right: 0; background: #10151F; border: 1px solid var(--border); border-radius: 8px; max-height: 180px; overflow-y: auto; z-index: 20; box-shadow: 0 6px 20px rgba(0,0,0,0.5); display: none; }
    .yc-dropdown.show { display: block; }
    .yc-option { padding: 10px; text-align: center; font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .yc-option:last-child { border-bottom: none; }
    .yc-option:hover, .yc-option:active { background: rgba(183,148,246,0.12); }
</style>
</head>
<body>
<div class="container">
    <h1>🔧 เครื่องมือแก้ไข Lap</h1>
    <p class="subtitle">แก้เวลาเริ่ม/ปิดของแต่ละหม้อโดยตรง</p>

    <!-- v2: ด่านรหัสผ่านก่อนเข้าใช้งาน (client-side เท่านั้น กันคนไม่ตั้งใจเข้ามาเจอ ไม่ใช่ความปลอดภัยจริงจัง) -->
    <div class="card" id="passGate">
        <div class="field-group">
            <label for="passInput">ใส่รหัสผ่านก่อนเข้าใช้งาน</label>
            <input type="password" id="passInput" placeholder="รหัสผ่าน" autocomplete="off">
        </div>
        <button class="btn btn-save" id="passBtn">🔓 เข้าใช้งาน</button>
        <div class="status-msg" id="passStatusMsg"></div>
    </div>

    <div id="mainTool" style="display:none;">
    <div class="card">
        <div class="field-group">
            <label for="lapSelect">เลือก Lap</label>
            <select id="lapSelect">
                <option value="">— กำลังโหลดรายชื่อ Lap... —</option>
            </select>
        </div>

        <div id="editArea" style="display:none;">
            <div class="field-group">
                <label for="timeInput">เวลาเริ่ม (time)</label>
                <input type="datetime-local" id="timeInput" step="1">
                <div class="raw-preview">epoch ms: <span id="timeRaw">-</span></div>
            </div>

            <div class="field-group">
                <label for="closedAtInput">เวลาปิด (closedAt) — เว้นว่างได้ถ้ายัง live อยู่</label>
                <input type="datetime-local" id="closedAtInput" step="1">
                <div class="raw-preview">epoch ms: <span id="closedAtRaw">-</span></div>
            </div>

            <div class="field-group">
                <label for="ycVal1Input">ยาขวดที่ 1 (YC)</label>
                <div class="yc-combo" id="ycCombo1">
                    <input type="text" inputmode="numeric" id="ycVal1Input" placeholder="-" autocomplete="off">
                    <div class="yc-dropdown" id="ycDropdown1"></div>
                </div>
            </div>

            <div class="field-group">
                <label for="ycVal2Input">ยาขวดที่ 2 (YC)</label>
                <div class="yc-combo" id="ycCombo2">
                    <input type="text" inputmode="numeric" id="ycVal2Input" placeholder="-" autocomplete="off">
                    <div class="yc-dropdown" id="ycDropdown2"></div>
                </div>
            </div>

            <button class="btn btn-save" id="saveBtn">💾 บันทึกการแก้ไข</button>
            <button class="btn btn-danger" id="clearClosedBtn">ลบเวลาปิด (ทำให้กลับเป็น live)</button>
        </div>

        <div id="emptyHint" class="empty-hint">เลือก Lap ด้านบนก่อน เพื่อเริ่มแก้ไข</div>

        <div class="status-msg" id="statusMsg"></div>
    </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
    // v2: ด่านรหัสผ่าน (client-side เท่านั้น - แค่กันคนไม่ตั้งใจเข้ามาเจอ) -----
    const EDITOR_PASSWORD = "1234yc37"; // แก้รหัสผ่านตรงนี้ได้เลยตามใจชอบ
    const passGate = document.getElementById("passGate");
    const mainTool = document.getElementById("mainTool");
    const passInput = document.getElementById("passInput");
    const passBtn = document.getElementById("passBtn");
    const passStatusMsg = document.getElementById("passStatusMsg");

    function unlockTool() {
        passGate.style.display = "none";
        mainTool.style.display = "block";
        sessionStorage.setItem("lapEditorUnlocked", "1"); // จำไว้แค่ระหว่าง session นี้ (ปิดแท็บแล้วต้องใส่รหัสใหม่)
    }

    function tryUnlock() {
        if (passInput.value === EDITOR_PASSWORD) {
            unlockTool();
        } else {
            passStatusMsg.textContent = "รหัสผ่านไม่ถูกต้อง";
            passStatusMsg.className = "status-msg show err";
            passInput.value = "";
        }
    }

    passBtn.addEventListener("click", tryUnlock);
    passInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });

    // ถ้าเคยปลดล็อกไว้แล้วใน session นี้ ไม่ต้องให้กรอกซ้ำ
    if (sessionStorage.getItem("lapEditorUnlocked") === "1") {
        unlockTool();
    }
    // -----------------------------------------------------------------------

    const firebaseConfig = {
        databaseURL: "https://counter-v5-0-1-6b77d-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const lapSelect = document.getElementById("lapSelect");
    const editArea = document.getElementById("editArea");
    const emptyHint = document.getElementById("emptyHint");
    const timeInput = document.getElementById("timeInput");
    const closedAtInput = document.getElementById("closedAtInput");
    const timeRaw = document.getElementById("timeRaw");
    const closedAtRaw = document.getElementById("closedAtRaw");
    const ycVal1Input = document.getElementById("ycVal1Input");
    const ycVal2Input = document.getElementById("ycVal2Input");
    const ycDropdown1 = document.getElementById("ycDropdown1");
    const ycDropdown2 = document.getElementById("ycDropdown2");
    const ycCombo1 = document.getElementById("ycCombo1");
    const ycCombo2 = document.getElementById("ycCombo2");
    const saveBtn = document.getElementById("saveBtn");
    const clearClosedBtn = document.getElementById("clearClosedBtn");
    const statusMsg = document.getElementById("statusMsg");

    let lapsData = {};

    // v3: สร้าง YC combobox (dropdown ตัวเลข 10-1 แบบเดียวกับเว็บหลัก) -----
    function buildYcDropdown(dropdownEl, input) {
        for (let n = 10; n >= 1; n--) {
            const opt = document.createElement("div");
            opt.className = "yc-option";
            opt.textContent = n;
            opt.addEventListener("click", () => {
                input.value = String(n);
                dropdownEl.classList.remove("show");
            });
            dropdownEl.appendChild(opt);
        }
    }
    buildYcDropdown(ycDropdown1, ycVal1Input);
    buildYcDropdown(ycDropdown2, ycVal2Input);

    ycVal1Input.addEventListener("focus", () => ycDropdown1.classList.add("show"));
    ycVal2Input.addEventListener("focus", () => ycDropdown2.classList.add("show"));
    document.addEventListener("click", (e) => {
        if (!ycCombo1.contains(e.target)) ycDropdown1.classList.remove("show");
        if (!ycCombo2.contains(e.target)) ycDropdown2.classList.remove("show");
    });
    // -----------------------------------------------------------------------

    // แปลง epoch ms -> ค่าสำหรับใส่ใน <input type="datetime-local"> (ใช้เวลาท้องถิ่นของเบราว์เซอร์)
    function epochToLocalInput(ms) {
        if (!ms) return "";
        const d = new Date(ms);
        const pad = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    // แปลงค่าจาก <input type="datetime-local"> กลับเป็น epoch ms
    function localInputToEpoch(value) {
        if (!value) return null;
        return new Date(value).getTime();
    }

    function showStatus(msg, isError) {
        statusMsg.textContent = msg;
        statusMsg.className = "status-msg show " + (isError ? "err" : "ok");
        setTimeout(() => { statusMsg.className = "status-msg"; }, 3500);
    }

    // โหลดรายชื่อ Lap ทั้งหมด + ค่า YC ของทุก Lap มาใส่ dropdown พร้อมกัน (เรียงใหม่->เก่า)
    let ycData = {};
    Promise.all([
        db.ref("/kratom_laps").once("value"),
        db.ref("/kratom_yc").once("value")
    ]).then(([lapsSnap, ycSnap]) => {
        lapsData = lapsSnap.val() || {};
        ycData = ycSnap.val() || {};
        const keys = Object.keys(lapsData).sort().reverse(); // push key เรียงตามเวลาสร้างอยู่แล้ว
        if (keys.length === 0) {
            lapSelect.innerHTML = `<option value="">ไม่พบ Lap เลย</option>`;
            return;
        }
        lapSelect.innerHTML = `<option value="">— เลือก Lap —</option>` + keys.map((key) => {
            const lap = lapsData[key];
            const dateLabel = lap.time ? new Date(lap.time).toLocaleString("th-TH") : "(ไม่มีเวลา)";
            // v3: ต่อท้ายด้วยเลข YC ถ้ามี (แบบเดียวกับ dropdown ค้นหา lap ในหน้าเว็บหลัก)
            const yc = ycData[key];
            let ycLabel = "";
            if (yc) {
                const has1 = yc.val1 !== undefined && yc.val1 !== null && yc.val1 !== "";
                const has2 = yc.val2 !== undefined && yc.val2 !== null && yc.val2 !== "";
                if (has1 && has2) ycLabel = ` · ยา ${yc.val1},${yc.val2}`;
                else if (has1) ycLabel = ` · ยา ${yc.val1}`;
                else if (has2) ycLabel = ` · ยา ${yc.val2}`;
            }
            return `<option value="${key}">lap${lap.lapNumber ?? "?"} — ${dateLabel}${ycLabel}</option>`;
        }).join("");
    }).catch((err) => {
        lapSelect.innerHTML = `<option value="">โหลดไม่สำเร็จ: ${err.message}</option>`;
    });

    lapSelect.addEventListener("change", () => {
        const key = lapSelect.value;
        if (!key) {
            editArea.style.display = "none";
            emptyHint.style.display = "block";
            return;
        }
        const lap = lapsData[key];
        editArea.style.display = "block";
        emptyHint.style.display = "none";

        timeInput.value = epochToLocalInput(lap.time);
        timeRaw.textContent = lap.time || "-";
        closedAtInput.value = epochToLocalInput(lap.closedAt);
        closedAtRaw.textContent = lap.closedAt || "(ยัง live อยู่)";

        // ใช้ค่า YC ที่โหลดแคชไว้แล้วตอนสร้าง dropdown (ไม่ต้องดึงซ้ำ)
        const ycEntry = ycData[key];
        ycVal1Input.value = ycEntry ? (ycEntry.val1 || "") : "";
        ycVal2Input.value = ycEntry ? (ycEntry.val2 || "") : "";
    });

    // อัปเดตตัวเลข epoch ที่โชว์ไว้ให้เห็นแบบสดๆ ตอนแก้ picker
    timeInput.addEventListener("input", () => {
        const ms = localInputToEpoch(timeInput.value);
        timeRaw.textContent = ms || "-";
    });
    closedAtInput.addEventListener("input", () => {
        const ms = localInputToEpoch(closedAtInput.value);
        closedAtRaw.textContent = ms || "(ยัง live อยู่)";
    });

    saveBtn.addEventListener("click", () => {
        const key = lapSelect.value;
        if (!key) return;

        const newTime = localInputToEpoch(timeInput.value);
        const newClosedAt = localInputToEpoch(closedAtInput.value);

        if (!newTime) {
            showStatus("ต้องมีเวลาเริ่มเสมอ ห้ามเว้นว่าง", true);
            return;
        }
        if (newClosedAt && newClosedAt < newTime) {
            showStatus("เวลาปิดต้องอยู่หลังเวลาเริ่มเท่านั้น", true);
            return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = "กำลังบันทึก...";

        const updates = { time: newTime };
        if (newClosedAt) {
            updates.closedAt = newClosedAt;
        }

        // เตรียมค่า YC ไว้บันทึกคู่กัน (เก็บเป็น string ให้ตรงรูปแบบเดียวกับที่หน้า Dashboard หลักใช้)
        const ycVal1 = ycVal1Input.value.trim();
        const ycVal2 = ycVal2Input.value.trim();
        const ycUpdates = { val1: ycVal1, val2: ycVal2, updatedAt: Date.now() };

        Promise.all([
            db.ref("/kratom_laps/" + key).update(updates),
            db.ref("/kratom_yc/" + key).update(ycUpdates)
        ]).then(() => {
            lapsData[key] = { ...lapsData[key], ...updates };
            ycData[key] = ycUpdates;
            // อัปเดตข้อความใน dropdown ให้ตรงกับ YC ใหม่ทันที ไม่ต้องโหลดหน้าใหม่
            const opt = lapSelect.querySelector(`option[value="${key}"]`);
            if (opt) {
                const lap = lapsData[key];
                const dateLabel = lap.time ? new Date(lap.time).toLocaleString("th-TH") : "(ไม่มีเวลา)";
                let ycLabel = "";
                if (ycVal1 && ycVal2) ycLabel = ` · ยา ${ycVal1},${ycVal2}`;
                else if (ycVal1) ycLabel = ` · ยา ${ycVal1}`;
                else if (ycVal2) ycLabel = ` · ยา ${ycVal2}`;
                opt.textContent = `lap${lap.lapNumber ?? "?"} — ${dateLabel}${ycLabel}`;
            }
            showStatus("บันทึกสำเร็จแล้ว ✓ (ทั้งเวลาและ YC)", false);
            saveBtn.disabled = false;
            saveBtn.textContent = "💾 บันทึกการแก้ไข";
        }).catch((err) => {
            showStatus("บันทึกไม่สำเร็จ: " + err.message, true);
            saveBtn.disabled = false;
            saveBtn.textContent = "💾 บันทึกการแก้ไข";
        });
    });

    clearClosedBtn.addEventListener("click", () => {
        const key = lapSelect.value;
        if (!key) return;
        if (!confirm("ลบเวลาปิดของ lap นี้ ทำให้กลับไปเป็นสถานะ live?")) return;

        db.ref("/kratom_laps/" + key + "/closedAt").remove().then(() => {
            closedAtInput.value = "";
            closedAtRaw.textContent = "(ยัง live อยู่)";
            delete lapsData[key].closedAt;
            showStatus("ลบเวลาปิดแล้ว", false);
        }).catch((err) => {
            showStatus("ลบไม่สำเร็จ: " + err.message, true);
        });
    });
</script>
</body>
</html>
